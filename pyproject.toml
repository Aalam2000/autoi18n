[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-i18n-lib"
version = "2.0.9"
description = "Post-render HTML and frontend UI dictionary translation for Python projects with OpenAI-backed caching"
authors = [
  { name = "Andrey Bondarenko", email = "bona.plus2030@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
  "i18n",
  "l10n",
  "translation",
  "html",
  "fastapi",
  "flask",
  "jinja2",
  "openai"
]
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic"
]

[project.urls]
Homepage = "https://bona-plus.ru"
Source = "https://github.com/Aalam2000/autoi18n"
Issues = "https://github.com/Aalam2000/autoi18n/issues"

[project.scripts]
autoi18n = "autoi18n.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Node/Babel мост распространяется как ресурс пакета — Node.js обязателен
# в окружении, где запускается сканирование (см. README, раздел "Требования").
autoi18n = ["extractor/js_bridge/*.js", "extractor/js_bridge/*.json"]
